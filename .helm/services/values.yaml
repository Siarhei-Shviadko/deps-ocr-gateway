podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

ocr_api_gateway_settings:
  ENV: development
  PROJECT_VERSION: '0.2.0'
  WORKERS: '1'
  RELOAD: 'false'
  LOG_LEVEL: 'info'
  MAX_REQUESTS: '1000'
  TIMEOUT: '600'
  OMP_THREAD_LIMIT: '2'
  OCR_ENGINES_PREINIT: 'false'
  OCR_ENABLE_CUDA_GPU: 'false'
  SENTRY_ENABLED: 'false'
  SENTRY_TRACE_ENABLED: 'false'
  SENTRY_TRACES_SAMPLE_RATE: '1.0'

  DEBUG: 'false'
  RABBITMQ_PORT: '5672'

  VERIFY_SSL: 'false'
  PAID_ENGINES_RESTRICTION_ENABLED: 'false'
  ENABLED_OCR_ENGINES: '["TESSERACT"]'
  PRIVILEGED_GROUP: 'deps-admins'

  # Auth
  AUTH_VERIFY_SSL: false

  DOCUMENTATION_ENABLED: "true"

  # Kafka
  KAFKA_GROUP_ID: 'ocr'
  KAFKA_SECURITY_ENABLED: false
  KAFKA_ENABLE_AUTO_COMMIT: false
  KAFKA_ENABLE_AUTO_OFFSET_STORE: true
  KAFKA_MAX_POLL_INTERVAL_MS: 300000

  #engine_urls
  TESSERACT_URL: http://tesseract-engin:8000
  AWS_TEXTRACT_URL: http://aws-textract-engin:8000
  GCP_VISION_URL: http://gcp-vision-engin:8000
  AZURE_FORM_RECOGNIZER_URL: http://azure-form-recognizer-engin:8000
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000/api/storage/v1/file'
  OCR_GATEWAY_URL: http://ocr:8000

  ## List of enabled OCR engines
  TESSERACT_ENABLED: true
  GCP_VISION_ENABLED: false
  AWS_TEXTRACT_ENABLED: false
  AZURE_FORM_RECOGNIZER_ENABLED: true

  ## Engine timeouts
  TESSERACT_TIMEOUT: 60
  GCP_VISION_TIMEOUT: 60
  AWS_TEXTRACT_TIMEOUT: 60
  AZURE_FORM_RECOGNIZER_TIMEOUT: 60

  # Azure Service Bus
  ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'
  ASB_TOPIC_NAME: 'deps-topic'
  message_broker_asb_without_manage_permission: false

helm:
  helm_logs_job_enabled: false

csi:
  csi_default_name: deps-ocr-api-gateway
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
