# Default values for deps-ocr-api-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Secrets declaration
# Precreate them before deploy
# kubectl create secret generic gcp-vision-auth-key --from-literal=gcp-vision-auth-key='<gcp-vision-auth-key>'
# kubectl create secret generic keycloak-certs-endpoint --from-literal=keycloak-certs-endpoint='<https://KEYCLOAK_URL/auth/realms/Test/protocol/openid-connect/certs>'
# kubectl create secret generic ocr-aws-credentials \
#   --from-literal=aws-access-key-id='<aws-access-key-id>' \
#   --from-literal=aws-secret-access-key='<aws-secret-access-key>' \
#   --from-literal=aws-region-name='<aws-region-name>'

secrets:
  gcp_vision_auth_key:
    secretName: gcp-vision-auth-key
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  ocr_aws_credentials:
    secretName: ocr-aws-credentials
  ocr_azure_credentials:
    secretName: azure-credentials
  auth_enabled:
    secretName: auth-enabled
  message_broker:
    secretName: message-broker
  kafka_secrets:
    secretName: kafka-secrets
  common_secret:
    secretName: common-secret
  deps_ocr:
    secretName: deps-ocr-api-gateway

env: ""
registry: ""

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: '/base/kubernetes-helm'
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

ocr_api_gateway:
  replicaCount: 1
  podAnnotations: {}
  image:
    path: '/deps-dev-x01/deps-ocr-api-gateway'
    tag: ''
    pullPolicy: IfNotPresent
  imagePullSecrets: 'artifactory'
  container:
    portname: 'ocr-cn-prt'
    port: 8000
    protocol: TCP
  service:
    type: ClusterIP
    portname: 'ocr-svc-prt'
    port: 8000
    protocol: TCP
    enabled: true
  resources: {}
  #    limits:
  #      cpu: 0.5
  #      memory: 1500Mi
  #    requests:
  #      cpu: 0.25
  #      memory: 800Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    INSTALL_DEV_DEPENDENCIES: true

ocr_api_gateway_consumer:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-ocr-api-gateway'
    pullPolicy: IfNotPresent
    tag: ''
  imagePullSecrets: artifactory
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

