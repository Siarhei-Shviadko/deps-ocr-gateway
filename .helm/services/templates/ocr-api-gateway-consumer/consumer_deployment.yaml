apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-api-gateway-consumer
  labels:
    {{- include "deps-ocr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ocr_api_gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-ocr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.ocr_api_gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deps-ocr.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.ocr_api_gateway.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.ocr_api_gateway.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or .Values.vault_settings.hashicorp_vault .Values.vault_settings.gcp_secret_manager .Values.vault_settings.aws_secret_manager }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.registry }}{{.Values.ocr_api_gateway.image.path}}:{{ .Values.ocr_api_gateway.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.ocr_api_gateway.image.pullPolicy }}
          command: ["python", "-m", "deps_ocr_gateway", "consume"]
          env:
          - name: INSTALL_DEV_DEPENDENCIES
            value: {{ .Values.ocr_api_gateway.env.INSTALL_DEV_DEPENDENCIES | quote }}
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.vault_enabled_consumer.env | nindent 10 }}
          {{ if .Values.ocr_api_gateway_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: deps-ocr
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-ocr
                key: kafka-sasl-password
          {{ end }}
          {{ else }}
          {{- toYaml .Values.vault_disabled_consumer.env | nindent 10 }}
          {{ if .Values.ocr_api_gateway_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-password
          {{ end }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - "bash"
                - "-c"
                - |
                  if [ "$MESSAGING_DRIVER" == "rabbitmq" ]; then
                    echo > /dev/tcp/$MESSAGING_DRIVER/5672 && echo "RabbitMQ connected" || { echo "RabbitMQ not connected"; exit 1; }
                  fi

                  if [ "$MESSAGING_DRIVER" == "kafka" ]; then
                    echo > /dev/tcp/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f1)/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f2) && echo "Kafka connected" || { echo "Kafka not connected"; exit 1; }
                  fi
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 14
          volumeMounts:
          {{- if .Values.vault_settings.enabled }}
          - name: secrets-store-inline
            mountPath: {{ .Values.secrets_location.secrets_default_path }}
            readOnly: true
          {{- end }}
          envFrom:
          - configMapRef:
              name: ocr-api-gateway-configmap
              optional: false
          resources:
            {{- toYaml .Values.ocr_api_gateway.resources | nindent 12 }}
      volumes:
      {{- if .Values.vault_settings.enabled }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{- with .Values.ocr_api_gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ocr_api_gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ocr_api_gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
