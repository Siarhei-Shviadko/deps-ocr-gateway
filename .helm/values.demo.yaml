ocr_api_gateway:
  image:
    path: '/deps-platform/deps-ocr-api-gateway'
  resources: {}

ocr_api_gateway_consumer:
  image:
    path: '/deps-platform/deps-ocr-api-gateway'
  resources: {}

ocr_api_gateway_aws_textract:
  image:
    path: '/deps-platform/deps-ocr-api-gateway-aws-textract'
  resources: {}

ocr_api_gateway_azure_form_recognizer:
  image:
    path: '/deps-platform/deps-ocr-api-gateway-azure-form-recognizer'
  resources: {}

ocr_api_gateway_gcp_vision:
  image:
    path: '/deps-platform/deps-ocr-api-gateway-gcp-vision'
  resources: {}

ocr_api_gateway_tesseract:
  image:
    path: '/deps-platform/deps-ocr-api-gateway-tesseract'
  resources: {}

ocr_api_gateway_settings:
  ENV: demo
  SENTRY_ENABLED: 'false'
  SENTRY_TRACES_SAMPLE_RATE: '0.1'
  ENABLED_OCR_ENGINES: '["TESSERACT","AWS_TEXTRACT","GCP_VISION","AZURE_FORM_RECOGNIZER"]'

  ## List of enabled OCR engines
  TESSERACT_ENABLED: true
  GCP_VISION_ENABLED: true
  AWS_TEXTRACT_ENABLED: true
  AZURE_FORM_RECOGNIZER_ENABLED: true

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-demo'
  roleName: 'k8s-demo'
  vaultKubernetesMountPath: 'kubernetes-demo'

service_account:
  serviceAccountName: 'deps-demo'
