[tool.poetry]
name = "deps_ocr_engines"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
click = "^8.1.3"
dependency-injector = "^4.48.0"
uvicorn = "^0.32.0"
fastapi = "^0.120.0"
uvloop = "^0.21"
gunicorn = "^22.0.0"
Pillow = "^12.1.1"
numpy = ">=1.26,<2"
sentry-sdk = "^1.1.0"
httpx = "^0.25.0"
authlib = "^1.6.7"
requests = "^2.32.5"
urllib3 = "^2.6.3"
cryptography = "^46.0.5"
python-multipart = "^0.0.22"
starlette = "^0.49.1"
httptools = "^0.6"
types-requests = "^2.32.4.20260107"

# engines
tesseract-engine = {path = "./deps_ocr_engines/infrastructure/engines/tesseract-engine", develop = true, optional = true}

[[tool.poetry.source]]
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dev-dependencies]
flake8 = "^7.0.0"
bandit = "^1.7.5"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.1.3"
pytest-factoryboy = "^2.0.3"
pytest-mock = "^3.4.0"
requests-mock = "~1.9.3"
coverage = "~5.3.1"
mypy = "^1.5.1"
six = ">=1.17.0"

[tool.poetry.extras]
tesseract-engine = ["tesseract-engine"]
craft-tesseract-engine = ["craft-tesseract-engine"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''
