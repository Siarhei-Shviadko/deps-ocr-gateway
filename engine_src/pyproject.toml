[tool.poetry]
name = "deps_ocr_engines"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
click = "^8.1.3"
dependency-injector = "^4.48.0"
uvicorn = "^0.32.0"
fastapi = "^0.120"
python-multipart = "^0.0.22"
uvloop = "^0.21"
httptools = "^0.6"
gunicorn = "^22.0.0"
authlib = "^1.6.7"
cryptography = "^46.0.5"
Pillow = "^12.1.1"
numpy = ">=1.26.4,<2.0"
sentry-sdk = "^1.1.0"
httpx = "^0.25.0"
requests = "^2.32.5"

# engines
aws-textract-engine = {path = "deps_ocr_engines/infrastructure/engines/aws-textract-engine", develop = true, optional = true}
gcpvision-engine = {path = "deps_ocr_engines/infrastructure/engines/gcpvision-engine", develop = true, optional = true}
azure-form-recognizer-engine = {path = "deps_ocr_engines/infrastructure/engines/azure-form-recognizer-engine", develop = true, optional = true}

[[tool.poetry.source]]
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dev-dependencies]
flake8 = "^6.1.0"
bandit = "^1.7.5"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
pytest-factoryboy = "^2.0.3"
pytest-mock = "^3.4.0"
requests-mock = "~1.9.3"
coverage = "^5.5"
mypy = "^1.5.1"

[tool.poetry.extras]
paddle-engine = ["paddle-engine"]
easyocr-engine = ["easyocr-engine"]
aws-textract-engine = ["aws-textract-engine"]
abbyy-engine = ["abbyy-engine"]
gcpvision-engine = ["gcpvision-engine"]
azure-form-recognizer-engine = ["azure-form-recognizer-engine"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''

